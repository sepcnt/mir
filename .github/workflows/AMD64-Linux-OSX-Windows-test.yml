name: AMD64-Linux-OSX-Windows-test

on: [push, workflow_dispatch]

jobs:
  test:

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: windows-latest
            core_cmake_args: -A x64 -T ClangCL
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v1
    - name: embedded JIT without C2MIR
      run: |
        cmake -S . -B build-core -DCMAKE_BUILD_TYPE=Release -DMIR_BUILD_C2MIR=OFF -DMIR_BUILD_TOOLS=OFF -DBUILD_TESTING=ON ${{ matrix.core_cmake_args }}
        cmake --build build-core --config Release
        ctest --test-dir build-core -C Release --output-on-failure
    - name: make test
      if: runner.os != 'Windows'
      run: make test
    - name: cmake test
      if: runner.os == 'Windows'
      run: |
        cmake -A x64 -DBUILD_TESTING=ON
        cmake --build . --config Release
        ctest --verbose --output-on-failure

